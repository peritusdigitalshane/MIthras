# /opt/peritus-frontend/nginx.conf  (mounted into peritus-frontend container
# as /etc/nginx/conf.d/default.conf).
#
# Serves the Mithras marketing site + console SPA out of /opt/peritus-frontend
# (mounted to /usr/share/nginx/html). NPM does SSL termination upstream;
# we only see plain HTTP from the proxy.
#
# 2026-06-16 update — fixes from the SEO audit in /SEO Issues/:
#   * /guides 403: old config had a `location = /guides { return 200 "" }`
#     hack to dodge a static guides/ directory collision. That returned an
#     empty body and didn't handle the trailing-slash variant, so /guides/
#     fell through to nginx's directory autoindex (disabled) → 403. Now
#     the SPA fallback handles all the variants.
#   * Apex → www: 301 mithras.com.au → www.mithras.com.au in a single hop.
#   * Prerender: `try_files $uri $uri/ $uri/index.html /index.html` serves
#     dist/<route>/index.html when prerender wrote one, and the SPA shell
#     for anything else.

server {
    listen 80;
    server_name localhost mithras.com.au www.mithras.com.au;
    root /usr/share/nginx/html;
    index index.html;

    # ----- Apex → www, single 301 hop. SSL is terminated upstream by NPM,
    # so we just look at $http_host (== Host header forwarded from NPM).
    if ($http_host = "mithras.com.au") {
        return 301 https://www.mithras.com.au$request_uri;
    }

    # ----- Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # ----- Static assets are content-hashed by Vite — cache for a year.
    # try_files $uri =404 means missing assets 404 (don't fall through to
    # the SPA shell, which would serve HTML for a missing JS file and
    # confuse the browser).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----- Short-cache the discovery / robots files.
    location = /sitemap.xml { expires 1h; try_files $uri =404; }
    location = /robots.txt  { expires 1h; try_files $uri =404; }

    # ----- The load-bearing SPA + prerender fallback.
    # /pricing → /pricing/index.html (prerendered)   → if missing
    #         → /pricing                              → if missing
    #         → /index.html (SPA shell)
    # /guides  → /guides/index.html (prerendered)    → if missing
    #         → falls through to /index.html
    # This single rule replaces the old `location = /guides { ... }` hack.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # ----- Security headers. Marketing site is read-only public; we keep
    # them conservative.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
}
