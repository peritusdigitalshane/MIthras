# /opt/peritus-frontend/nginx.conf  (or wherever the container's config lives)
#
# Drop-in nginx server block for the Mithras marketing site. Designed to
# replace whatever currently fronts /opt/peritus-frontend on docker02.
# Solves the SEO findings in /SEO Issues/ from 2026-06-16:
#
#   * apex (mithras.com.au) duplicates www → 29 multi-sitemap dupes + 15
#     duplicate-pages-without-canonical → 301 to www collapses both
#   * /guides/ returned 403 (Error-4XX_page) → SPA fallback now serves the
#     React shell for any unknown path
#   * Multi-hop HTTP→HTTPS→www redirect chains → single 301 to canonical
#   * Prerendered HTML files in dist/<route>/index.html now served first
#     for SEO crawlers, with SPA shell as the fallback for users
#
# Stack: nginx in a docker container with /opt/peritus-frontend mounted at
# /usr/share/nginx/html, plus LE certs from /etc/letsencrypt. Adjust paths
# to match your actual layout.

# ---------------------------------------------------------------------------
# Redirect everything non-canonical (HTTP, apex) to https://www.mithras.com.au
# ---------------------------------------------------------------------------
server {
    listen 80  default_server;
    listen 443 ssl default_server;
    server_name mithras.com.au www.mithras.com.au;

    # Re-use whichever cert covers BOTH the apex and the www host — typically
    # an SAN cert covering both names. If apex has its own cert keep both.
    ssl_certificate     /etc/letsencrypt/live/mithras.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mithras.com.au/privkey.pem;

    # Apex → www, HTTP → HTTPS in ONE hop. SEO audit flagged 4 separate
    # multi-hop chains; this collapses them all.
    if ($host = mithras.com.au)     { return 301 https://www.mithras.com.au$request_uri; }
    if ($scheme = http)             { return 301 https://www.mithras.com.au$request_uri; }
}

# ---------------------------------------------------------------------------
# Canonical host
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name www.mithras.com.au;

    ssl_certificate     /etc/letsencrypt/live/www.mithras.com.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.mithras.com.au/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Don't let the apex sitemap.xml be reachable via this vhost — the apex
    # variant should never resolve thanks to the 301 above, but if some
    # edge cache holds the old path, a robots.txt-aware crawler can
    # follow this Disallow.
    add_header X-Robots-Tag "noindex" always;
    add_header Vary           "Accept-Encoding";

    # Static assets are content-hashed by Vite — cache them HARD.
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|webp|png|jpe?g|gif|ico|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # sitemap.xml / robots.txt / IndexNow keyfile — short-cache.
    location = /sitemap.xml { expires 1h; try_files $uri =404; }
    location = /robots.txt  { expires 1h; try_files $uri =404; }

    # ----- SPA + prerender fallback (the load-bearing block) -----
    # 1. /pricing                 → /pricing/index.html (prerendered)  → if missing,
    # 2.                          → /pricing.html                       → if missing,
    # 3.                          → /index.html (SPA shell)             → always serves
    #
    # This is what fixes the /guides/ 403: any unknown URI now lands on
    # the SPA shell so React Router can handle the route client-side.
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Security headers — content unchanged, just better defaults.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    # CSP is intentionally absent — Vite serves inline scripts during dev,
    # and the marketing site is read-only public content. Add per-route
    # if you tighten later.
}
