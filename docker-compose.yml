version: '3.8'

services:
  peritus-secure:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # No defaults — fail-fast if env vars aren't set. Use .env.production
        # (gitignored) or pass them via the build command. NEVER hardcode the
        # JWT here; that committed key would land in every clone of the repo.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL must be set}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY must be set}
        BUILD_MODE: production
    container_name: peritus-secure
    ports:
      - "9988:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "app.name=peritus-threat-defence"
      - "app.description=Peritus Threat Defence - Windows Defender Management Platform"

  peritus-secure-staging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${STAGING_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${STAGING_SUPABASE_ANON_KEY}
        BUILD_MODE: staging
    container_name: peritus-secure-staging
    profiles: ["staging"]
    ports:
      - "9989:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "app.name=peritus-threat-defence-staging"
      - "app.description=Peritus Threat Defence (staging, self-hosted Supabase)"

  # Optional: Add Traefik for HTTPS (uncomment if needed)
  # traefik:
  #   image: traefik:v2.10
  #   container_name: traefik
  #   command:
  #     - "--api.insecure=true"
